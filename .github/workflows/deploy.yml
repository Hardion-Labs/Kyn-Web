# Builds the site (Vite + React + Tailwind) and publishes the dist/ folder to GitHub Pages.
#
# REQUIRED SETUP (one time) in the repository:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# With "Deploy from a branch" GitHub publishes the raw source code: an index.html
# that points to /src/main.tsx, a file the browser cannot run.
# The result is a completely blank page.
name: Deploy to GitHub Pages

on:
  # Publishes on every push to the main branch
  push:
    branches: [main]
  # Allows running manually from the Actions tab ("Run workflow")
  workflow_dispatch:

# Minimal permissions by default; the deploy job declares the ones it needs.
permissions:
  contents: read

# One deployment at a time. Does not cancel a deployment in progress: the most
# recent run waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      # Name of the artifact uploaded in this attempt (see the last step)
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - name: Download the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload the dist/ folder to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          # One name per attempt: if the run is repeated ("Re-run jobs"),
          # there won't be two artifacts with the same name, which would make the deploy fail.
          name: github-pages-${{ github.run_attempt }}
          path: dist

  # Separate job from the build: only this one gets permission to publish, and the
  # artifact is already available when the deploy starts.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # verify the origin of the deploy (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also publishes the
      # raw source code on every push and the site may go blank again.
      # Instead of letting this pass silently, it fails with a clear instruction.
      - name: Check the Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)"
          echo "Pages build_type: ${build_type:-unknown}"
          if [ "$build_type" = "legacy" ]; then
            echo "::error title=GitHub Pages is set to Deploy from a branch::Open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages and, under Build and deployment → Source, select GitHub Actions. Then run this workflow again (Re-run jobs button)."
            exit 1
          fi

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
